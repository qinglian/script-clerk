<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/script-clerk/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#304156" />
    <meta name="description" content="专业的场记单管理工具，支持完全离线使用" />
    <link rel="manifest" href="/script-clerk/manifest.json" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="场记系统" />
    <link rel="apple-touch-icon" href="/script-clerk/vite.svg" />

    <title>场记软件 - Script Clerk</title>
    <script type="module" crossorigin src="/script-clerk/assets/index-BqdxGV9x.js"></script>
    <link rel="stylesheet" crossorigin href="/script-clerk/assets/index-Dj73uu7m.css">
  </head>
  <body>
    <div id="app"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/script-clerk/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);

              // 检查更新
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // 有新版本可用
                    if (confirm('有新版本可用，是否更新？')) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                      location.reload();
                    }
                  }
                });
              });
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
